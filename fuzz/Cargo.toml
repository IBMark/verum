[package]
name = "verum-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
verum-nucleus = { path = "../crates/verum-nucleus" }
verum-mappa = { path = "../crates/verum-mappa" }
verum-lumen = { path = "../crates/verum-lumen", features = ["fuzzing"] }

# Deliberately its own workspace: `fuzz/` must never be pulled into the root
# workspace, or `cargo build --workspace` at the repo root would start building
# libFuzzer and requiring nightly.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "parse_rust"
path = "fuzz_targets/parse_rust.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_python"
path = "fuzz_targets/parse_python.rs"
test = false
doc = false
bench = false


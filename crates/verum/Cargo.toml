[package]
name = "verum"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Deterministic, whole-program, multi-language code analyzer (CLI and library)."

# `cargo binstall verum` fetches the prebuilt binary from the GitHub release
# instead of compiling. The release archives are tagged `v{version}`.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.{ archive-format }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[[bin]]
name = "verum"
path = "src/main.rs"

[dependencies]
verum-nucleus = { workspace = true }
verum-mappa = { workspace = true }
verum-lumen = { workspace = true }
verum-faber = { workspace = true }
verum-arbiter = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
indicatif = { workspace = true }
console = { workspace = true }
colored = { workspace = true }
walkdir = { workspace = true }

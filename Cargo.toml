[workspace]
members = [
    "crates/verum-nucleus",
    "crates/verum-mappa",
    "crates/verum-lumen",
    "crates/verum-faber",
    "crates/verum-arbiter",
    "crates/verum",
]
resolver = "2"

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Internet Backbone Ltd <verum@ibh.group>"]
repository = "https://github.com/IBMark/verum"
description = "Deterministic, whole-program, multi-language code analysis"
readme = "README.md"
keywords = ["static-analysis", "linter", "code-analysis", "security", "cli"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
verum-nucleus = { path = "crates/verum-nucleus", version = "0.1.3" }
verum-mappa = { path = "crates/verum-mappa", version = "0.1.3" }
verum-lumen = { path = "crates/verum-lumen", version = "0.1.3" }
verum-faber = { path = "crates/verum-faber", version = "0.1.3" }
verum-arbiter = { path = "crates/verum-arbiter", version = "0.1.3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rayon = "1.10"
petgraph = { version = "0.6", features = ["serde-1"] }
ahash = "0.8"
walkdir = "2"
regex = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
console = "0.15"
colored = "2"
tree-sitter = "0.22"
serde_yaml = "0.9"
